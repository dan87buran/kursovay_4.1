{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">
                    <i class="bi bi-key"></i> Сброс пароля
                </h4>
            </div>
            <div class="card-body">
                <p>Забыли пароль? Введите свой email ниже, и мы отправим инструкции по сбросу пароля.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-envelope"></i> Отправить инструкции
                        </button>
                        <a href="{% url 'users:login' %}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Назад к входу
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

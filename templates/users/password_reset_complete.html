{% extends 'base.html' %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0 text-success">
                    <i class="bi bi-check-circle"></i> Пароль успешно изменен
                </h4>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    <h5>Ваш пароль был успешно изменен!</h5>
                    <p>Теперь вы можете войти в систему с новым паролем.</p>
                </div>
                <div class="text-center mt-4">
                    <a href="{% url 'users:login' %}" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> Войти в систему
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
